plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chk.voicecut'
    compileSdk 34

    defaultConfig {
        applicationId 'com.chk.voicecut'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Kotlin 1.8+ a fusionné le contenu des anciens artefacts jdk7/jdk8 dans
// kotlin-stdlib. Certaines dépendances binaires réclament encore les anciens
// artefacts 1.6.0 : on les retire pour éviter les classes dupliquées.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'

    // Le code VoiceCut reste entièrement Java. Cette bibliothèque runtime est
    // seulement requise par certaines dépendances binaires transitives.
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'

    // TAndroidLame embarque le véritable encodeur LAME natif. Ses anciennes
    // dépendances Android Support ne sont pas requises par VoiceCut.
    implementation('com.github.naman14:TAndroidLame:1.1') {
        exclude group: 'com.android.support'
    }
}
